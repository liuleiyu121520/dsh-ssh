<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Identity: a terminal prompt sitting inside a host frame — "a shell on
       a remote machine". The frame is the host, the ">_" is the prompt the
       user actually types into. currentColor so the launchpad tile can tint
       it per theme. -->
  <rect x="2.5" y="3.5" width="19" height="17" rx="3" stroke="currentColor" stroke-width="1.8"/>
  <path d="M7 9.5 10.5 12 7 14.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M12.5 15H17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
</svg>
